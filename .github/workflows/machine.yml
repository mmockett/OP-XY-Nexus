name: Machine checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # Nexus needs SDK 1.13 (stereo synth voices and a synth's Shift row); pin a compatible SDK commit for a release.
  OPEN_XY_REF: staging
jobs:
  # The machine's records, browser preview, drawing checks and its own host
  # tests (tests/sound.cpp, tests/screen.cpp).
  machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexus
      - uses: actions/checkout@v4
        with:
          repository: etcetc000/open-xy
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview and host tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python -m pip install numpy==2.3.5 shapely==2.2.0
      - name: The artwork and tables are what the generators write
        run: |
          python nexus/nexus/tools/make_panel.py
          python nexus/nexus/tools/make_tables.py
          git -C nexus diff --exit-code
      - name: Machine source, preview and sound checks
        run: python open-xy/sdk.py test --machine nexus/nexus --cxx clang++ --host-cxx g++
  # The native compile with the SDK's pinned Blackfin tools.
  firmware:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexus
      - uses: actions/checkout@v4
        with:
          repository: etcetc000/open-xy
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned Blackfin tools
        run: python open-xy/sdk.py toolchain fetch
      - name: Native compile (no stock firmware or device)
        run: python open-xy/sdk.py compile --machine nexus/nexus --out "${{ runner.temp }}/module"
